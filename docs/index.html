<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camvital Scan</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1021;
        --panel: #171c31;
        --text: #eef2ff;
        --muted: #a9b0c7;
        --accent: #78f0ff;
        --border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(120, 240, 255, 0.12), transparent 32%),
          linear-gradient(180deg, #10142a 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.2rem, 6vw, 3.6rem);
        line-height: 1.05;
      }

      p {
        color: var(--muted);
        line-height: 1.65;
      }

      .card {
        margin-top: 28px;
        padding: 22px;
        background: rgba(23, 28, 49, 0.88);
        border: 1px solid var(--border);
        border-radius: 18px;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }

      a {
        color: var(--text);
      }

      .button {
        display: inline-block;
        padding: 12px 16px;
        text-decoration: none;
        background: rgba(120, 240, 255, 0.16);
        border: 1px solid rgba(120, 240, 255, 0.32);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Camvital Scan</h1>
      <p>
        Camvital Scan is an iPhone wellness app that estimates heart rate using the
        rear camera and flash, stores optional history on device, and can
        optionally save readings to Apple Health.
      </p>

      <section class="card">
        <h2>Links</h2>
        <div class="links">
          <a class="button" href="./privacy-policy.html">Privacy Policy</a>
          <a class="button" href="./support.html">Support</a>
          <a class="button" href="https://github.com/drsaikrishnathota1/ai-powered-pulse-monitor">GitHub Repository</a>
        </div>
      </section>
    </main>
  </body>
</html>
